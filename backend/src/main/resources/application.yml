spring:
  application:
    name: barkwalk-backend
  profiles:
    # Local sans SPRING_PROFILES_ACTIVE → secrets faibles autorisés via application-dev.yml
    default: dev
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration
  datasource:
    url: jdbc:postgresql://127.0.0.1:5434/barkwalk
    username: barkwalk
    password: barkwalk
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  docker:
    compose:
      # Compose est démarré manuellement (port hôte 5433 : 5432 déjà pris)
      enabled: false
      file: ../docker-compose.yml
      lifecycle-management: start_only
  mail:
    # Défaut local = Mailhog (docker compose). Prod : MAIL_HOST / BREVO via env.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=10m
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  health:
    # Le check SMTP ne doit pas faire tomber readiness en local (Mailhog sans auth).
    mail:
      enabled: false

barkwalk:
  cors:
    allowed-origins: http://localhost:4200
  jwt:
    # Pas de défaut ici : fourni par application-dev.yml ou JWT_SECRET (obligatoire hors dev).
    secret: ${JWT_SECRET:}
    access-token-minutes: 15
    refresh-token-days: 14
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:barkwalk}
    secret-key: ${S3_SECRET_KEY:barkwalksecret}
    bucket: ${S3_BUCKET:barkwalk-docs}
    region: ${S3_REGION:eu-west-3}
    signed-url-minutes: 15
  storage:
    local-path: ${STORAGE_LOCAL_PATH:./data/uploads}
    # Pas de défaut ici : application-dev.yml ou STORAGE_SIGNING_SECRET.
    signing-secret: ${STORAGE_SIGNING_SECRET:}
  stripe:
    api-key: ${STRIPE_API_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  mail:
    from: ${MAIL_FROM:noreply@barkwalk.local}
    brevo-api-key: ${BREVO_API_KEY:}
    enabled: ${MAIL_ENABLED:true}
  demo:
    seed-users: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework.security: INFO
    com.barkwalk: INFO
