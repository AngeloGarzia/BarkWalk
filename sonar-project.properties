# Référence SonarCloud — les valeurs actives pour Maven sont aussi dans pom.xml.
# Utilisé si l’analyse CLI (hors Maven) est lancée manuellement.
sonar.organization=angelogarzia
sonar.projectKey=AngeloGarzia_BarkWalk
sonar.projectName=BarkWalk
sonar.host.url=https://sonarcloud.io

sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java,frontend/src
sonar.test.inclusions=**/*Test.java,**/*IT.java,**/*.spec.ts
sonar.java.binaries=backend/target/classes
sonar.java.libraries=backend/target/dependency/*.jar
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

sonar.exclusions=**/generated/**,**/*MapperImpl.java,**/node_modules/**,**/dist/**,**/*.min.js
sonar.coverage.exclusions=**/domain/**,**/dto/**,**/*Dtos.java,**/config/**,**/BarkWalkApplication.java
